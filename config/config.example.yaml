# Valori iniziali da tarare sui dati reali. Il controller rilegge il file quando cambia.
solo_osserva: true            # prime settimane: decide e registra, non comanda

solis:
  inverter_sn: "DA_COMPILARE" # numero di serie inverter come appare in SolisCloud
  # Segni da verificare sulla prima risposta reale di inverterDetail:
  rete_cessione_positiva: true    # psum > 0 significa cessione alla rete
  batteria_carica_positiva: true  # batteryPower > 0 significa batteria in carica
  intervallo_s: 300
  dati_vecchi_dopo_min: 20

rele:
  tipo: shelly_gen2
  ip: "192.168.5.DA_COMPILARE"
  canale: 0
  # Cablaggio: ingresso X-20 (doppio setpoint) della Maxa; relè eccitato = Boost, a riposo = Normale.

boost:
  entra:
    surplus_min_kw: 1.5
    soc_min: 90
    fascia: ["09:00", "17:00"]
    pausa_dall_ultimo_cambio_min: 20
  esci:
    deficit_kw: 0.5           # prelievo da rete + scarica batteria, sommati
    per_min: 10
    soc_sotto: 70
    dopo_le: "18:00"
  durata_min_min: 30
  cambi_max_giorno: 6
  media_campioni: 3

pausa_manuale_ore: 4

sensori_temperatura:          # termostato BTicino MyHOME via OpenWebNet (SENSORI_TEMP in .env)
  zone: auto                  # scoperta automatica; oppure nomi: {1: casa} o {1: soggiorno, 2: camere}
  temp_max_boost: 22.5        # niente boost, o uscita dal boost, se casa è a questa temperatura o oltre
  dati_vecchi_dopo_min: 15    # oltre questo tempo la temperatura si ignora e restano le regole solari
  # la temperatura esterna arriva dalla Maxa (nessuna sonda esterna sul BUS BTicino)

maxa:                         # cloud Maxa Connect (POMPA=maxa_cloud), credenziali in secrets/
  installazione: ""           # vuoto = primo impianto dell'account
  componente: ""              # vuoto = prima pompa di calore trovata sull'impianto
  boost: comfort              # Boost = Comfort, Normale = Economy (preset h7204/h7207 nella app)
  mqtt_v311: false            # true solo se AWS IoT rifiuta la connessione MQTT 3.1
  lettura_stato_min: 15
  errori_prima_di_sospendere: 3
  sospensione_min: 60

storico:
  conserva_giorni: 400

avvisi:
  tipo: ntfy                  # ntfy | telegram | nessuno
  canale: "DA_COMPILARE"
